name: KancolleIOS
options:
  bundleIdPrefix: com.ugakky
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  KancolleIOS:
    type: application
    platform: iOS
    sources:
      - path: KancolleIOS
        excludes:
          - Resources
      - path: KancolleIOS/Resources
        buildPhase: resources
    info:
      path: KancolleIOS/Info.plist
      properties:
        CFBundleDisplayName: "艦これ Safety"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ugakky.kancolleios
        PRODUCT_NAME: KancolleIOS
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - KancolleIOSTests
      gatherCoverageData: false

  KancolleIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KancolleIOSTests
    dependencies:
      - target: KancolleIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ugakky.kancolleios.tests
